server:
  port: 8081
  servlet:
    context-path: /${spring.application.name}

spring:
  application:
    name: mdm-adapter
  datasource:
    url: jdbc:postgresql://localhost:5434/mdm-adapter
    username: postgres
    password: postgres
    hikari:
      schema: mdm
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${spring.datasource.hikari.schema}
  liquibase:
    change-log: db/changelog/changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cloud:
    openfeign:
      client:
        config:
          user-data-service-one-client:
            read-timeout: 3000
            connect-timeout: 3000
          user-data-service-two-client:
            read-timeout: 3000
            connect-timeout: 3000

mdm:
  system:
    username: chugunovao
  kafka:
    mdm-event:
      enable: true
      change-phone:
        topic-in: MDM.Change.Phone.IN.V1
  service:
    user-data-one:
      url: http://81.30.105.54:8080
      response-timeout-seconds: 5
    user-data-two:
      url: http://81.30.105.54:8080
      response-timeout-seconds: 5


