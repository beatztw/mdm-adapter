server:
  port: 8081
  servlet:
    context-path: /${spring.application.name}

spring:
  application:
    name: mdm-adapter
  datasource:
    url: jdbc:postgresql://localhost:5434/mdm-adapter
    username: postgres
    password: postgres
    hikari:
      schema: mdm
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${spring.datasource.hikari.schema}
  liquibase:
    change-log: db/changelog/changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate


