databaseChangeLog:
  - changeSet:
      id: "02.create_mdm_message_outbox.yaml"
      author: "Chugunov AO"
      changes:
        - createTable:
            tableName: mdm_message_outbox
            remarks: "Статус отправки MDM события во внешний сервис"
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: mdm_message_id
                  type: UUID
                  remarks: "Уникальный идентификатор события"
              - column:
                  name: status
                  type: varchar
                  remarks: "Статус доставки сообщения"
              - column:
                  name: target
                  type: varchar
                  remarks: "Направление, куда должно быть доставлено сообщение"
              - column:
                  name: response_data
                  type: jsonb
                  remarks: "Ответ от внешнего сервиса в формате JSON"

              - column:
                  name: create_time
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP AT TIME ZONE 'UTC'
                  constraints:
                    nullable: false
                  remarks: "Время создания"
              - column:
                  name: create_user
                  type: varchar
                  constraints:
                    nullable: false
                  remarks: "Пользователь, создавший запись"
              - column:
                  name: last_update_time
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP AT TIME ZONE 'UTC'
                  constraints:
                    nullable: false
                  remarks: "Время обновления"
              - column:
                  name: last_update_user
                  type: varchar
                  constraints:
                    nullable: false
                  remarks: "Пользователь, изменивший запись"